# =============================================================================
# Production with Monitoring Stack
# =============================================================================
# Production setup with observability:
# - Prometheus for metrics collection
# - Grafana for visualization
# - Node Exporter for system metrics
# - Pre-configured dashboards
#
# Usage:
#   docker compose -f production-monitoring.yml up -d
#
# GitHub credential - injected per run, never mounted:
#   export GH_TOKEN="$(cat /run/secrets/claudetm_github_token)"   # your secret store
#   docker compose -f production-monitoring.yml up -d
#
#   A repository-scoped, least-privilege token owned by a bot account (e.g.
#   claudetm[bot]). It carries no admin scope - CI, required reviews and
#   branch protection stay mandatory - and it is revoked and rotated
#   independently of the Claude credential. Never written into this file, never
#   stored in the image, never printed. CLAUDETM_GITHUB_TOKEN is an accepted
#   alias for the same value.
#
# Access:
#   Claude Task Master: http://localhost:8000
#   Grafana: http://localhost:3000 (admin/admin)
#   Prometheus: http://localhost:9090
#
# =============================================================================

version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # Claude Task Master Server
  # ---------------------------------------------------------------------------
  claudetm:
    image: ghcr.io/developerz-ai/claude-task-master:latest
    container_name: claudetm-app
    restart: always

    ports:
      - "${CLAUDETM_REST_PORT:-8000}:8000"
      - "${CLAUDETM_MCP_PORT:-8080}:8080"

    volumes:
      # Agent credential - REQUIRED. Named volume holding the api-key profile
      # (a scoped, rotatable key issued to the agent). Never mount a human's
      # ~/.claude: that is a personal OAuth token, so the agent would run as and
      # bill that person - it leaked across developers once already.
      - "claudetm-profiles:/home/claudetm/.claudetm"
      - "${PROJECT_PATH:-.}:/app/project"

      # NO personal GitHub or git configuration is mounted here:
      #   - the operator's ~/.config/gh holds a personal login, so the agent
      #     would act as - and be billed to - that person;
      #   - the operator's ~/.gitconfig carries their identity and can carry a
      #     personal push credential.
      # The image configures git itself (bot identity + a gh-backed credential
      # helper) and points gh at an isolated, empty GH_CONFIG_DIR.

    environment:
      # Agent credential - REQUIRED. The api-key profile inside claudetm-profiles.
      - CLAUDETM_PROFILE=${CLAUDETM_PROFILE:-agent}

      # GitHub credential (REQUIRED for PR and CI operations): injected per run
      # from the deployment's environment, never read from disk and never
      # written into this file. GH_TOKEN is gh's own standard variable;
      # CLAUDETM_GITHUB_TOKEN is claudetm's alias for the same value.
      #
      # The default is empty, never the "${VAR:?...}" form: a missing
      # credential must fail closed at the gh call - with a message naming the
      # variable - not stop the container from starting.
      - GH_TOKEN=${GH_TOKEN:-}
      - CLAUDETM_GITHUB_TOKEN=${CLAUDETM_GITHUB_TOKEN:-}

      # gh's config directory, isolated inside the container: empty, owned by
      # claudetm, never the operator's ~/.config/gh. A personal "gh auth login"
      # is therefore not a fallback - with no credential injected the
      # container fails closed and names the variable that carries one.
      - GH_CONFIG_DIR=/home/claudetm/.claudetm/gh
      - "CLAUDETM_PASSWORD=${CLAUDETM_PASSWORD:?CLAUDETM_PASSWORD is required}"
      - CLAUDETM_SERVER_HOST=0.0.0.0
      - CLAUDETM_REST_PORT=8000
      - CLAUDETM_MCP_PORT=8080
      - CLAUDETM_LOG_LEVEL=${CLAUDETM_LOG_LEVEL:-info}
      - CLAUDETM_WEBHOOK_URL=${CLAUDETM_WEBHOOK_URL:-}
      - CLAUDETM_WEBHOOK_SECRET=${CLAUDETM_WEBHOOK_SECRET:-}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - claudetm-monitoring

    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8000"
      - "prometheus.path=/metrics"

  # ---------------------------------------------------------------------------
  # Prometheus - Metrics Collection
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: claudetm-prometheus
    restart: always

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'

    networks:
      - claudetm-monitoring

    depends_on:
      - claudetm

  # ---------------------------------------------------------------------------
  # Grafana - Visualization
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: claudetm-grafana
    restart: always

    ports:
      - "3000:3000"

    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=
      - GF_USERS_ALLOW_SIGN_UP=false

    networks:
      - claudetm-monitoring

    depends_on:
      - prometheus

  # ---------------------------------------------------------------------------
  # Node Exporter - System Metrics
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:latest
    container_name: claudetm-node-exporter
    restart: always

    ports:
      - "9100:9100"

    command:
      - '--path.rootfs=/host'

    volumes:
      - /:/host:ro,rslave

    networks:
      - claudetm-monitoring

volumes:
  # Created once out-of-band (see "Agent credential" at the bottom) so the
  # credential survives `docker compose down`. The host-side name is
  # overridable: two deployments on one host that share it also share one
  # agent credential, so give each its own CLAUDETM_PROFILES_VOLUME.
  claudetm-profiles:
    external: true
    name: ${CLAUDETM_PROFILES_VOLUME:-claudetm-profiles}
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  claudetm-monitoring:
    driver: bridge

# =============================================================================
# Monitoring Configuration Files
# =============================================================================
#
# Create these files in ./monitoring/ directory:
#
# 1. monitoring/prometheus/prometheus.yml - Prometheus config
# 2. monitoring/prometheus/alerts.yml - Alert rules
# 3. monitoring/grafana/provisioning/datasources/prometheus.yml - Grafana datasource
# 4. monitoring/grafana/provisioning/dashboards/dashboard.yml - Dashboard config
# 5. monitoring/grafana/dashboards/claudetm.json - Claude Task Master dashboard
#
# See monitoring-config directory for examples.
#
# =============================================================================
# Usage
# =============================================================================
#
# Start all services:
#   docker compose -f production-monitoring.yml up -d
#
# View logs:
#   docker compose -f production-monitoring.yml logs -f claudetm
#
# Access Grafana:
#   open http://localhost:3000
#   Login: admin/admin (change on first login)
#
# Access Prometheus:
#   open http://localhost:9090
#
# Stop services:
#   docker compose -f production-monitoring.yml down
#
# =============================================================================
# Agent credential (one time)
# =============================================================================
#
#   docker volume create claudetm-profiles
#   docker run --rm \
#     -v claudetm-profiles:/home/claudetm/.claudetm \
#     -e CLAUDETM_API_KEY="$AGENT_API_KEY" \
#     ghcr.io/developerz-ai/claude-task-master:latest \
#     claudetm profile add agent --type api-key \
#       --base-url https://your-gateway.example/anthropic
#
# The key is read from the environment at creation time; keep it in your secret
# store, never in this file, in .env, or in the image.
#
# =============================================================================
# GitHub credential (per run)
# =============================================================================
#
#   export GH_TOKEN="$(cat /run/secrets/claudetm_github_token)"
#   docker compose -f production-monitoring.yml up -d
#
# The token is a repository-scoped, least-privilege bot credential: no admin
# scope, so CI, required reviews and branch protection stay mandatory, and it
# is revoked and rotated independently of the Claude credential. It is read
# from the environment, never written into this file, never stored in the
# image and never printed.
#
# gh reads its configuration from GH_CONFIG_DIR (/home/claudetm/.claudetm/gh)
# - an empty directory owned by claudetm - so the operator's ~/.config/gh is
# never read and a personal "gh auth login" is not a fallback.
#
# =============================================================================
