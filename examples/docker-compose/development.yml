# =============================================================================
# Development Environment
# =============================================================================
# Development setup with:
# - No authentication (for ease of development)
# - Debug logging
# - Volume mount for source code (hot reload)
# - Development tools
#
# ⚠️ WARNING: DO NOT USE IN PRODUCTION
# This configuration disables authentication and security features.
#
# Usage:
#   docker compose -f development.yml up
#   docker compose -f development.yml up --build  # Rebuild on changes
#
# GitHub credential - injected per run, never mounted:
#   export GH_TOKEN="$(cat /run/secrets/claudetm_github_token)"   # your secret store
#   docker compose -f development.yml up
#
#   A repository-scoped, least-privilege token owned by a bot account (e.g.
#   claudetm[bot]), revoked and rotated independently of the Claude
#   credential. Never written into this file, never stored in the image, never
#   printed. CLAUDETM_GITHUB_TOKEN is an accepted alias for the same value.
#
# =============================================================================

version: "3.8"

services:
  claudetm-dev:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: development  # Use development stage if available
    container_name: claudetm-dev
    restart: "no"  # Don't auto-restart in dev

    ports:
      - "8000:8000"
      - "8080:8080"

    volumes:
      # Source code (for hot reload if supported)
      - ../../src:/app/src:ro
      - ../../pyproject.toml:/app/pyproject.toml:ro

      # Agent credential - REQUIRED. Named volume holding the api-key profile
      # (a scoped, rotatable key issued to the agent). Never mount your own
      # ~/.claude: the container would run as, and bill, your Claude account -
      # that is exactly how a token leaked across developers once already.
      - "claudetm-profiles:/home/claudetm/.claudetm"

      # Project directory for testing
      - "${PROJECT_PATH:-../../tmp/test-project}:/app/project"

      # NO personal GitHub or git configuration is mounted here:
      #   - the operator's ~/.config/gh holds a personal login, so the agent
      #     would act as - and be billed to - that person;
      #   - the operator's ~/.gitconfig carries their identity and can carry a
      #     personal push credential.
      # The image configures git itself (bot identity + a gh-backed credential
      # helper) and points gh at an isolated, empty GH_CONFIG_DIR.

    environment:
      # Agent credential - REQUIRED. The api-key profile inside claudetm-profiles.
      - CLAUDETM_PROFILE=${CLAUDETM_PROFILE:-agent-dev}

      # GitHub credential (REQUIRED for PR and CI operations): injected per run
      # from the deployment's environment, never read from disk and never
      # written into this file. GH_TOKEN is gh's own standard variable;
      # CLAUDETM_GITHUB_TOKEN is claudetm's alias for the same value.
      #
      # The default is empty, never the "${VAR:?...}" form: a missing
      # credential must fail closed at the gh call - with a message naming the
      # variable - not stop the container from starting.
      - GH_TOKEN=${GH_TOKEN:-}
      - CLAUDETM_GITHUB_TOKEN=${CLAUDETM_GITHUB_TOKEN:-}

      # gh's config directory, isolated inside the container: empty, owned by
      # claudetm, never the operator's ~/.config/gh. A personal "gh auth login"
      # is therefore not a fallback - with no credential injected the
      # container fails closed and names the variable that carries one.
      - GH_CONFIG_DIR=/home/claudetm/.claudetm/gh

      # No password in development (WARNING: insecure!)
      - CLAUDETM_PASSWORD=${CLAUDETM_PASSWORD:-}

      # Debug logging
      - CLAUDETM_LOG_LEVEL=debug

      # Server configuration
      - CLAUDETM_SERVER_HOST=0.0.0.0
      - CLAUDETM_REST_PORT=8000
      - CLAUDETM_MCP_PORT=8080
      - CLAUDETM_MCP_TRANSPORT=sse

      # Development mode
      - CLAUDETM_DEV_MODE=true
      - PYTHONUNBUFFERED=1

    # No health check in development
    healthcheck:
      disable: true

    # Interactive terminal
    stdin_open: true
    tty: true

    networks:
      - claudetm-dev

volumes:
  # Created once out-of-band (see "Agent credential" below) so the credential
  # survives `docker compose down`. Deliberately a *different* host volume from
  # the production examples: sharing one would put the production key in reach
  # of a dev container that is running without authentication.
  claudetm-profiles:
    external: true
    name: ${CLAUDETM_PROFILES_VOLUME:-claudetm-profiles-dev}

networks:
  claudetm-dev:
    driver: bridge

# =============================================================================
# Development Commands
# =============================================================================
#
# Start development server:
#   docker compose -f development.yml up
#
# Rebuild and start:
#   docker compose -f development.yml up --build
#
# Run tests:
#   docker compose -f development.yml exec claudetm-dev pytest
#
# Run linter:
#   docker compose -f development.yml exec claudetm-dev ruff check .
#
# Format code:
#   docker compose -f development.yml exec claudetm-dev ruff format .
#
# Type check:
#   docker compose -f development.yml exec claudetm-dev mypy .
#
# Access shell:
#   docker compose -f development.yml exec claudetm-dev bash
#
# View logs:
#   docker compose -f development.yml logs -f
#
# Stop:
#   docker compose -f development.yml down
#
# =============================================================================
# Environment Variables (.env)
# =============================================================================
#
# Optional for development:
#   PROJECT_PATH=../../tmp/test-project
#   CLAUDETM_PROFILE=agent-dev      # api-key profile in claudetm-profiles
#   CLAUDETM_PASSWORD=dev-password  # Only if you want auth in dev
#   GH_TOKEN=github-token-from-your-secret-store   # Agent GitHub credential
#
# =============================================================================
# GitHub credential (per run)
# =============================================================================
#
# Even in development the container gets its own scoped GitHub token - not
# your personal login:
#
#   export GH_TOKEN="$(cat /run/secrets/claudetm_github_token)"
#   docker compose -f development.yml up
#
# The token is a repository-scoped, least-privilege bot credential: no admin
# scope, so CI, required reviews and branch protection stay mandatory, and it
# is revoked and rotated independently of the Claude credential. It is read
# from the environment, never written into this file, never stored in the
# image and never printed.
#
# gh reads its configuration from GH_CONFIG_DIR (/home/claudetm/.claudetm/gh)
# - an empty directory owned by claudetm - so your ~/.config/gh is never read
# and a personal "gh auth login" is not a fallback.
#
# =============================================================================
# Agent credential (one time)
# =============================================================================
#
# Even in development the container gets its own scoped key - not your personal
# Claude login, and not the production agent's key either (hence the separate
# claudetm-profiles-dev volume):
#
#   docker volume create claudetm-profiles-dev
#   docker run --rm \
#     -v claudetm-profiles-dev:/home/claudetm/.claudetm \
#     -e CLAUDETM_API_KEY="$AGENT_API_KEY" \
#     ghcr.io/developerz-ai/claude-task-master:latest \
#     claudetm profile add agent-dev --type api-key \
#       --base-url https://your-gateway.example/anthropic
#
# The key is read from the environment at creation time; keep it in your secret
# store, never in this file, in .env, or in the image.
#
# =============================================================================
