# =============================================================================
# Claude Task Master - Docker Compose Configuration
# =============================================================================
# This file provides a ready-to-use development and production setup for running
# Claude Task Master with Docker. It configures the unified server with proper
# volume mounts for the agent's own credential and your project files.
#
# One-time setup — the agent's scoped credential:
#   docker volume create claudetm-profiles
#   docker run --rm \
#     -v claudetm-profiles:/home/claudetm/.claudetm \
#     -e CLAUDETM_API_KEY="$AGENT_API_KEY" \
#     ghcr.io/developerz-ai/claude-task-master:latest \
#     claudetm profile add agent --type api-key \
#       --base-url https://your-gateway.example/anthropic
#
# Quick Start:
#   docker compose up                        # Start with defaults
#   docker compose up --build                # Rebuild and start
#   docker compose down                      # Stop and remove containers
#
# With Password Authentication:
#   CLAUDETM_PASSWORD=secret docker compose up
#
# For more configuration options, see the environment variables below.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Claude Task Master Server
  # ---------------------------------------------------------------------------
  # Runs the unified server (REST API + MCP server) with shared authentication.
  #
  # Ports:
  #   - 8000: REST API (FastAPI)
  #   - 8080: MCP Server (SSE or streamable-http)
  #
  # Volumes:
  #   - claudetm-profiles: the agent's own scoped API credential (api-key profile)
  #   - ./project: Project directory for task execution (mount your repo here)
  #
  # ---------------------------------------------------------------------------
  claudetm:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/developerz-ai/claude-task-master:latest
    container_name: claudetm-server
    restart: unless-stopped

    # Port mappings
    ports:
      - "${CLAUDETM_REST_PORT:-8000}:8000"
      - "${CLAUDETM_MCP_PORT:-8080}:8080"

    # Volume mounts
    volumes:
      # Agent credential - REQUIRED. A named volume holding the claudetm profile
      # registry (the agent's own scoped, rotatable API key). Never bind-mount a
      # human's ~/.claude here - see "Volume Mount Notes" at the bottom.
      - "claudetm-profiles:/home/claudetm/.claudetm"

      # Project directory - mount your repository here
      # The server will execute tasks in this directory
      - "${PROJECT_PATH:-.}:/app/project"

      # Git configuration - for commit operations
      - "${HOME}/.gitconfig:/home/claudetm/.gitconfig:ro"

      # GitHub CLI configuration - for PR operations
      - "${HOME}/.config/gh:/home/claudetm/.config/gh:ro"

    # Environment variables
    environment:
      # Agent credential (REQUIRED): the api-key profile to run as. The key
      # itself lives in the claudetm-profiles volume, never in this file.
      - CLAUDETM_PROFILE=${CLAUDETM_PROFILE:-agent}

      # Authentication (REQUIRED for production)
      # Set CLAUDETM_PASSWORD to enable password authentication
      - CLAUDETM_PASSWORD=${CLAUDETM_PASSWORD:-}

      # Server configuration
      - CLAUDETM_SERVER_HOST=0.0.0.0
      - CLAUDETM_REST_PORT=8000
      - CLAUDETM_MCP_PORT=8080
      - CLAUDETM_MCP_TRANSPORT=${CLAUDETM_MCP_TRANSPORT:-sse}
      - CLAUDETM_LOG_LEVEL=${CLAUDETM_LOG_LEVEL:-info}

      # CORS configuration for web clients
      - CLAUDETM_CORS_ORIGINS=${CLAUDETM_CORS_ORIGINS:-}

      # Webhook configuration (optional)
      - CLAUDETM_WEBHOOK_URL=${CLAUDETM_WEBHOOK_URL:-}
      - CLAUDETM_WEBHOOK_SECRET=${CLAUDETM_WEBHOOK_SECRET:-}

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# =============================================================================
# Volumes
# =============================================================================
# Created once with `docker volume create claudetm-profiles` and populated with
# `claudetm profile add` (see the one-time setup at the top of this file), so it
# is declared external: the agent's credential outlives `docker compose down`.
volumes:
  claudetm-profiles:
    external: true

# =============================================================================
# Networks (optional, for multi-service setups)
# =============================================================================
networks:
  default:
    name: claudetm-network

# =============================================================================
# Usage Examples
# =============================================================================
#
# 1. Basic usage with password authentication:
#
#    export CLAUDETM_PASSWORD=your-secret-password
#    docker compose up
#
# 2. Mount a specific project directory:
#
#    PROJECT_PATH=/path/to/your/repo docker compose up
#
# 3. Run under a different agent profile (e.g. after rotating the key into a
#    freshly added profile):
#
#    CLAUDETM_PROFILE=agent-2 docker compose up
#
# 4. Enable debug logging:
#
#    CLAUDETM_LOG_LEVEL=debug docker compose up
#
# 5. Configure webhooks:
#
#    export CLAUDETM_WEBHOOK_URL=https://your-webhook.example.com/endpoint
#    export CLAUDETM_WEBHOOK_SECRET=your-webhook-secret
#    docker compose up
#
# 6. Development with hot reload (rebuild on changes):
#
#    docker compose up --build
#
# 7. Run in background:
#
#    docker compose up -d
#    docker compose logs -f  # Follow logs
#
# 8. Access the services:
#
#    REST API:  http://localhost:8000
#    API Docs:  http://localhost:8000/docs
#    MCP SSE:   http://localhost:8080/sse
#
# 9. Stop and remove:
#
#    docker compose down
#
# =============================================================================
# Volume Mount Notes
# =============================================================================
#
# Agent Credential (claudetm-profiles -> /home/claudetm/.claudetm):
#   The container authenticates with its OWN credential: a scoped, rotatable API
#   key stored in a claudetm "api-key" profile. claudetm injects it as
#   ANTHROPIC_API_KEY / ANTHROPIC_BASE_URL at the SDK subprocess boundary, and
#   skips the OAuth credentials-file check entirely - so no ~/.claude is read.
#
#   Why it is NOT a bind-mount of a human's ~/.claude:
#     - that directory holds a personal OAuth bearer token, so the agent would
#       run as, and bill, that human's Claude account;
#     - the token cannot be scoped to least privilege, and rotating it breaks
#       that person's own Claude login;
#     - anything that can read the container can read the token. This already
#       caused a real cross-developer credential leak - it is not theoretical.
#
#   Not read-only: claudetm writes the profile registry here.
#
#   The key comes from wherever your organisation issues agent credentials (an
#   Anthropic API key minted for the agent, or a key from a central Claude
#   gateway); provisioning is documented with that gateway, not in this repo.
#   Inject it only at profile-creation time via CLAUDETM_API_KEY, from your
#   secret store - never into this file or the image.
#
#   Rotation: add a new profile with the new key and switch CLAUDETM_PROFILE.
#
#   If you previously ran with `-v ~/.claude:/home/claudetm/.claude:ro`, treat
#   the token that exposed as compromised and re-run /login on the host.
#
# Project Directory:
#   Mount the repository you want Claude Task Master to work on.
#   The server will create a .claude-task-master/ directory inside for state.
#   Example: PROJECT_PATH=/home/user/my-project docker compose up
#
# Git Configuration:
#   Required for git commit operations during task execution.
#   Mounted read-only for security.
#
# GitHub CLI Configuration:
#   Required for creating PRs and other GitHub operations.
#   Contains your GitHub authentication token.
#   Mounted read-only for security.
#
# =============================================================================
